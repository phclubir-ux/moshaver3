name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
      - name: Build app
        run: bash setup.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moshaver-apk
          path: app-release.apk
